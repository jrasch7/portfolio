name: Pipeline

# Pipeline do portfólio. Cada job é uma etapa de scripts/pipeline/stages.mjs e roda exatamente o
# mesmo comando que roda na sua máquina (npm run stage -- <etapa>). O relatório de cada etapa vira
# um artefato; o job "relatorio" junta tudo em pipeline.json, que vai dentro do site publicado.
# Documentação: docs/PIPELINE.md.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-gate:
    name: 1. Gate do PR
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/pipeline/run.mjs pr-gate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-pr-gate
          path: reports/pr-gate.json
          retention-days: 7

  higiene:
    name: 2. Higiene do repositório
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/pipeline/run.mjs higiene
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-higiene
          path: reports/higiene.json
          retention-days: 7

  estatico:
    name: 3. Análise estática
    needs: higiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node scripts/pipeline/run.mjs estatico
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-estatico
          path: reports/estatico.json
          retention-days: 7

  build:
    name: 4. Build reproduzível
    needs: estatico
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        continue-on-error: true  # sem Pages ativado, usa a URL padrão
      - run: node scripts/pipeline/run.mjs build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: _site
          include-hidden-files: true
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-build
          path: reports/build.json
          retention-days: 7

  testes:
    name: 5. Testes ponta a ponta
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - run: npx playwright install --with-deps chromium
      - run: node scripts/pipeline/run.mjs testes
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-testes
          path: reports/testes.json
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            reports/playwright.json
            test-results
          retention-days: 7

  desempenho:
    name: 6. Desempenho
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - run: node scripts/pipeline/run.mjs desempenho
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-desempenho
          path: reports/desempenho.json
          retention-days: 7

  seguranca:
    name: 7. Segurança
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - run: node scripts/pipeline/run.mjs seguranca
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-seguranca
          path: reports/seguranca.json
          retention-days: 7

  relatorio:
    name: Relatório (pipeline.json)
    needs: [pr-gate, higiene, estatico, build, testes, desempenho, seguranca]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          path: reports
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true  # se o build falhou, não há site
        with:
          name: site
          path: _site
      - name: Juntar relatórios em pipeline.json (e colocar dentro do site)
        run: |
          mkdir -p _site
          node scripts/pipeline/report.mjs --site
      - name: Resumo na página da execução
        run: |
          node -e '
            const p = JSON.parse(require("fs").readFileSync("reports/pipeline.json","utf8"));
            const icon = { passed: "OK", failed: "FALHA", skipped: "pulada", pending: "pendente" };
            const rows = p.stages.map(s => `| ${s.name.pt} | ${icon[s.status]} | ${s.durationMs == null ? "" : (s.durationMs/1000).toFixed(1) + " s"} |`);
            console.log(["## Pipeline", "", "| Etapa | Resultado | Tempo |", "|---|---|---|", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipeline-report
          path: reports/pipeline.json
          retention-days: 30

  deploy:
    name: 8. Deploy (GitHub Pages)
    needs: [relatorio, testes, desempenho, seguranca]
    # Só da main. Exige Settings > Pages > Source: GitHub Actions. Para desligar o deploy sem apagar o job,
    # crie a variável de Actions PAGES_DEPLOY com o valor false.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.PAGES_DEPLOY != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: 9. Fumaça pós-deploy
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/pipeline/run.mjs smoke
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-smoke
          path: reports/smoke.json
          retention-days: 7

  finalizar:
    name: 10. Republicar a página com o resultado do smoke
    # O smoke só pode rodar depois que a página foi publicada, então o pacote do deploy não traz o resultado dele.
    # Este job refaz o relatório com o resultado do smoke e publica de novo o MESMO artefato (só o pipeline.json muda).
    needs: [deploy, smoke]
    if: needs.smoke.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: _site
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          path: reports
          merge-multiple: true
      - name: Refazer o pipeline.json, agora com o smoke
        run: node scripts/pipeline/report.mjs --site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-final
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-final
